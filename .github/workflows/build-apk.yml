name: Build APK (simple)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: "/usr/local/lib/android/sdk"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create signing.properties (stable in-repo keystore)
        run: |
          echo "KEYSTORE_FILE=$PWD/shizuku-release.p12" > signing.properties
          echo "KEYSTORE_PASSWORD=android" >> signing.properties
          echo "KEYSTORE_ALIAS=shizukuplus" >> signing.properties
          echo "KEYSTORE_ALIAS_PASSWORD=android" >> signing.properties

      - name: Build debug APK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          export GRADLE_OPTS="-Xmx4g -XX:MaxMetaspaceSize=512m"
          ./gradlew :manager:assembleShizukuplusDebug --stacktrace -x :manager:lint
          echo "=== built APKs ==="
          find manager/build/outputs/apk/shizukuplus/debug -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shizukuplus-debug-apk
          path: manager/build/outputs/apk/shizukuplus/debug/*.apk
