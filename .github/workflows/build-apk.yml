name: Build APK (simple)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: "/usr/local/lib/android/sdk"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject secrets (signing keystore + pre-authorized adb key)
        env:
          KS_B64: ${{ secrets.MINIS_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.MINIS_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.MINIS_KEYSTORE_ALIAS }}
          ADBKEY_B64: ${{ secrets.MINIS_ADBKEY_DER_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > shizukuplus-release.p12
          mkdir -p manager/src/main/assets
          echo "$ADBKEY_B64" | base64 -d > manager/src/main/assets/adbkey.der
          {
            echo "KEYSTORE_FILE=$PWD/shizukuplus-release.p12"
            echo "KEYSTORE_PASSWORD=$KS_PW"
            echo "KEYSTORE_ALIAS=$KS_ALIAS"
            echo "KEYSTORE_ALIAS_PASSWORD=$KS_PW"
          } > signing.properties
          ls -la shizukuplus-release.p12 manager/src/main/assets/adbkey.der

      - name: Build debug APK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          export GRADLE_OPTS="-Xmx4g -XX:MaxMetaspaceSize=512m"
          ./gradlew :manager:assembleShizukuplusDebug --stacktrace -x :manager:lint
          echo "=== built APKs ==="
          find manager/build/outputs/apk/shizukuplus/debug -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shizukuplus-debug-apk
          path: manager/build/outputs/apk/shizukuplus/debug/*.apk
